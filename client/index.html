<!doctype html>
<html lang="en">
  <!-- The single HTML page. React fills the root div with the app. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F4C40" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Fonts used by the app. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>AfyaTrack PHO</title>
    <!-- Applies the saved light or dark theme before the page draws. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- React mounts the app here, then loads the code from src/main.jsx. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
